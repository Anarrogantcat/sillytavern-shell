name: Release Lite

on:
  push:
    tags:
      - 'v*'

jobs:
  build-lite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Lite and publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win nsis --config electron-builder-lite.json --config.directories.output='dist-electron-v3-lite' --publish always