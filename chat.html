<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src http://localhost:* http://127.0.0.1:*">
<title>独立对话助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--bg2:#16162a;--fg:#c8c8d4;--accent:#7c5cbf;--border:rgba(255,255,255,.06);--input-bg:#1a1a30}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;display:flex;flex-direction:column;height:100vh}
#bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
#bar .model{font-size:12px;color:#9090a8;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button{background:none;border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
#bar button:hover{background:rgba(255,255,255,.08)}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff}
.msg.assistant{align-self:flex-start;background:var(--bg2);border:1px solid var(--border)}
.msg.err{background:rgba(224,108,117,.15);color:#e06c75}
.msg.hint{align-self:center;background:none;color:#606078;font-size:11px}
#input-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg2)}
#input{flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--fg);font-size:13px;outline:none;resize:none;height:42px;font-family:inherit}
#input:focus{border-color:var(--accent)}
#send{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:0 18px;cursor:pointer;font-size:13px}
#send:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body>
<div id="bar">
<span class="model" id="model-label">检测模型…</span>
<div style="display:flex;gap:6px;align-items:center">
<select id="session-select" title="会话列表"><option value="">加载会话…</option></select>
<button id="new-session" title="新建会话">＋</button>
<button id="del-session" title="删除当前会话">🗑</button>
<button id="clear">清空</button>
</div>
</div>
<div id="msgs"><div class="msg hint">独立对话助手——直连当前模型，不经过 SillyTavern 本体</div></div>
<div id="input-row">
<textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
<button id="send">发送</button>
</div>
<script>
const $ = s => document.querySelector(s);
const msgs = $('#msgs'), input = $('#input'), send = $('#send');
const sessSel = $('#session-select');
let currentSession = 'default';
function add(text, cls) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
}
function renderMsgs(list) {
    msgs.innerHTML = '<div class="msg hint">独立对话助手——直连当前模型，不经过 SillyTavern 本体</div>';
    for (const m of list || []) add(m.content, m.role === 'user' ? 'user' : 'assistant');
}
async function refreshSessions(selectId) {
    const list = await window.electronAPI?.chatSessions?.() || [];
    sessSel.innerHTML = '<option value="">选择会话…</option>' + list.map(s => `<option value="${s.id}">${s.title} (${s.count})</option>`).join('');
    if (selectId) sessSel.value = selectId;
}
async function loadSession(id) {
    const s = await window.electronAPI?.chatLoad?.(id);
    if (s) { currentSession = id; renderMsgs(s.messages); }
}
(async () => {
    const m = await window.electronAPI?.chatModel?.();
    $('#model-label').textContent = m?.model ? '模型: ' + m.model : '未检测到模型配置';
    await refreshSessions('default');
    await loadSession('default');
})();
async function doSend() {
    const t = input.value.trim();
    if (!t) return;
    input.value = '';
    add(t, 'user');
    send.disabled = true;
    const r = await window.electronAPI?.chatSend?.(t, currentSession);
    send.disabled = false;
    if (r?.error) add('失败: ' + r.error, 'err');
    else { add(r?.reply || '(空回复)', 'assistant'); await refreshSessions(r.sessionId); }
}
send.addEventListener('click', doSend);
input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
$('#clear').addEventListener('click', async () => {
    if (!confirm('删除当前会话？')) return;
    await window.electronAPI?.chatClear?.(currentSession);
    currentSession = 'default';
    await window.electronAPI?.chatNew?.() && refreshSessions();
    await refreshSessions();
    renderMsgs([]);
});
$('#new-session').addEventListener('click', async () => {
    const id = await window.electronAPI?.chatNew?.();
    await refreshSessions(id);
    await loadSession(id);
});
$('#del-session').addEventListener('click', async () => {
    if (!confirm('删除当前会话？')) return;
    await window.electronAPI?.chatClear?.(currentSession);
    const id = await window.electronAPI?.chatNew?.();
    await refreshSessions(id);
    await loadSession(id);
});
sessSel.addEventListener('change', () => { if (sessSel.value) loadSession(sessSel.value); });
</script>
</body>
</html>
