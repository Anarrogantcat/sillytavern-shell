<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self'; style-src 'self' 'unsafe-inline';">
<title>SillyTavern</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="titlebar">
<div class="titlebar-drag-region">
<div class="titlebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
<span class="titlebar-title">SillyTavern</span>
</div>
<div class="window-controls">
<button class="win-btn win-btn-minimize" id="btn-minimize" title="最小化"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="4.5" width="8" height="1" fill="currentColor"/></svg></button>
<button class="win-btn win-btn-maximize" id="btn-maximize" title="最大化"><svg width="10" height="10" viewBox="0 0 10 10" id="icon-maximize"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg><svg width="10" height="10" viewBox="0 0 10 10" id="icon-restore" style="display:none"><rect x="2" y="0.5" width="6.5" height="6.5" fill="none" stroke="currentColor" stroke-width="1"/><rect x="0.5" y="2" width="6.5" height="6.5" fill="#1a1a2e" stroke="currentColor" stroke-width="1"/></svg></button>
<button class="win-btn win-btn-close" id="btn-close" title="最小化到托盘"><svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2"/></svg></button>
</div>
</div>
<div id="loading-overlay"><div class="loading-content">
<div class="loading-spinner"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>
<div class="loading-text">SillyTavern 启动中...</div>
<div class="loading-log" id="loading-log"></div>
</div></div>
<webview id="sillytavern-webview" allowpopups="true" preload="./webview-preload.js" class="hidden"></webview>
<div id="float-buttons">
<button id="btn-toggle-fabs" class="float-toggle" title="隐藏按钮"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4 2 7 5 4 8"/></svg></button>
<button id="btn-terminal" class="float-btn" title="终端 (Ctrl+`)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></button>
<button id="btn-settings" class="float-btn" title="设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>

<button id="btn-refresh" class="float-btn" title="刷新页面 (F5)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
<button id="btn-tools" class="float-btn" title="工具箱"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></button>
</div>
<div id="terminal-panel" class="panel hidden">
<div class="term-resize-handle" id="term-resize-handle" title="拖动调整高度"></div>
<div class="panel-header"><span>终端</span><div style="display:flex;gap:8px;align-items:center"><button class="panel-action" id="btn-terminal-copy" title="复制全部">📋</button><button class="panel-close" id="btn-terminal-close">&times;</button></div></div>
<div class="terminal-output" id="terminal-output"></div>
<div class="terminal-input-row"><span class="terminal-prompt">&gt;</span><input type="text" id="terminal-input" placeholder="输入命令..."></div>
</div>
<div id="tools-panel" class="bench-panel hidden">
<div class="panel-header"><span>🧰 工具箱</span><button class="panel-close" id="btn-tools-close">&times;</button></div>
<div class="bench-body" style="font-size:12px">

<div class="tool-sec">📁 数据备份</div>
<div class="tool-actions"><button id="t-backup-now" class="btn-primary" style="padding:4px 10px;font-size:11px">立即备份</button><span id="t-backup-now-res" class="tool-note"></span></div>

<div class="tool-sec">🔍 聊天全文搜索</div>
<div class="tool-row"><input type="text" id="t-search-kw" class="tool-input" placeholder="输入关键词，回车搜索（跨全部角色卡）"></div>
<div id="t-search-res" class="tool-detail"></div>

<div class="tool-sec">📊 聊天统计</div>
<div class="tool-actions"><button id="t-stats" class="btn-secondary" style="padding:4px 10px;font-size:11px">统计</button><span id="t-stats-res" class="tool-note"></span></div>

<div class="tool-sec">📤 导出</div>
<div class="tool-actions">
<button id="t-export-cards" class="btn-secondary" style="padding:4px 10px;font-size:11px">导出角色卡</button>
<button id="t-summarize" class="btn-secondary" style="padding:4px 10px;font-size:11px">剧情总结</button>
<button id="t-export-html" class="btn-secondary" style="padding:4px 10px;font-size:11px">聊天导出 HTML</button>
<button id="t-portable" class="btn-secondary" style="padding:4px 10px;font-size:11px">便携包导出</button>
<span id="t-export-res" class="tool-note"></span>
</div>

<div class="tool-sec">👁 角色卡速览 / 世界书</div>
<div class="tool-row"><select id="t-card-list" class="tool-input"><option value="">选择角色卡…</option></select><button id="t-card-view" class="btn-secondary" style="padding:3px 8px;font-size:11px">查看</button></div>
<div id="t-card-res" class="tool-detail"></div>
<div class="tool-actions"><button id="t-worlds" class="btn-secondary" style="padding:4px 10px;font-size:11px">世界书列表</button><span id="t-worlds-note" class="tool-note"></span></div>

<div class="tool-sec">🤖 模型服务 / 环境</div>
<div class="tool-actions"><button id="t-model-service" class="btn-secondary" style="padding:4px 10px;font-size:11px">服务状态</button><button id="t-env" class="btn-secondary" style="padding:4px 10px;font-size:11px">环境体检</button><button id="t-ollama" class="btn-secondary" style="padding:4px 10px;font-size:11px">Ollama 模型</button><button id="t-gpu" class="btn-secondary" style="padding:4px 10px;font-size:11px">显存/温度</button><button id="t-clash" class="btn-secondary" style="padding:4px 10px;font-size:11px">Clash 状态</button></div>
<div id="t-env-res" class="tool-detail"></div>

<div class="tool-sec">📚 本地知识库 (RAG)</div>
<div class="tool-row"><input type="text" id="t-rag-q" class="tool-input" placeholder="输入关键词检索（文档放 userData/rag-docs/）"></div>
<div class="tool-actions"><button id="t-rag" class="btn-secondary" style="padding:4px 10px;font-size:11px">检索</button></div>
<div id="t-rag-res" class="tool-detail"></div>

<div class="tool-sec">✏️ 草稿生成器（直连模型）</div>
<div class="tool-row"><input type="text" id="t-draft-prompt" class="tool-input" placeholder="输入生成要求，如：写一段雨夜相遇的场景描写"></div>
<div class="tool-actions"><button id="t-draft" class="btn-primary" style="padding:4px 10px;font-size:11px">生成</button><button id="t-draft-copy" class="btn-secondary" style="padding:4px 10px;font-size:11px">复制</button></div>
<div id="t-draft-res" class="tool-detail"></div>

<div class="tool-sec">💬 独立对话助手</div>
<div class="tool-actions"><button id="t-chat" class="btn-primary" style="padding:4px 10px;font-size:11px">打开独立对话窗口</button></div>

<div class="tool-sec">🖥 界面</div>
<div class="tool-actions"><button id="t-immerse" class="btn-secondary" style="padding:4px 10px;font-size:11px">沉浸模式 (F11)</button></div>

<div class="tool-sec">🌐 公网隧道</div>
<div class="tool-row"><select id="t-tunnel" class="tool-input"><option value="0">关</option><option value="1">开</option></select><span class="tool-note">需先设访问密码</span></div>
<div id="t-tunnel-status" class="update-status"></div>
<div class="tool-actions"><button id="t-tunnel-copy" class="btn-secondary" style="display:none;padding:3px 8px;font-size:11px">复制公网地址</button></div>

<div class="tool-row"><label>局域网访问</label><select id="t-lan" class="tool-input" style="width:70px"><option value="0">关</option><option value="1">开</option></select><span class="tool-note" id="t-lan-ips"></span></div>
<div class="tool-row"><label>访问账号</label><input type="text" id="t-lan-user" class="tool-input" placeholder="留空=不认证"></div>
<div class="tool-row"><label>访问密码</label><input type="password" id="t-lan-pass" class="tool-input" placeholder="留空=不认证"></div>

<div class="tool-sec">🛰 ZeroTier 助手</div>
<div id="zt-status" class="tool-note">检测中…</div>
<div class="tool-row"><input type="text" id="zt-netid" class="tool-input" placeholder="输入 16 位网络 ID"></div>
<div class="tool-actions"><button id="zt-join" class="btn-secondary" style="padding:4px 10px;font-size:11px">加入网络</button><button id="zt-leave" class="btn-secondary" style="padding:4px 10px;font-size:11px">离开网络</button><button id="zt-copy" class="btn-secondary" style="padding:4px 10px;font-size:11px">复制访问地址</button></div>
<div id="zt-info" class="tool-detail"></div>

<div class="tool-sec">🖥 迷你状态窗</div>
<div class="tool-row"><label>迷你状态窗</label><select id="t-mini" class="tool-input"><option value="1">开</option><option value="0">关</option></select></div>

<div class="tool-sec">🔍 状态栏诊断</div>
<div class="tool-actions"><button id="t-diag-statusbar" class="btn-secondary" style="padding:4px 10px;font-size:11px">诊断</button><button id="t-fix-statusbar" class="btn-secondary" style="padding:4px 10px;font-size:11px">清理占位符</button></div>
<div id="t-diag-res" class="tool-detail"></div>

</div>
</div>
<div id="mini-status" class="mini-status hidden"><span id="mini-dot" class="mini-dot"></span><span id="mini-text">-</span><button id="mini-close" title="隐藏迷你状态窗">&times;</button></div>
<div id="lock-overlay" class="lock-overlay hidden">
<div class="lock-box">
<div style="font-size:28px;margin-bottom:8px">🔒</div>
<div class="lock-title">已锁定</div>
<input type="password" id="lock-pin" class="lock-input" placeholder="输入 PIN 解锁" autocomplete="off">
<div id="lock-err" class="lock-err"></div>
<button id="lock-unlock" class="btn-primary">解锁</button>
</div>
</div>

<div id="auth-overlay" class="overlay hidden">
<div class="auth-panel">
<div class="panel-header"><span>🔐 需要登录</span><button class="panel-close" id="btn-auth-cancel">&times;</button></div>
<div class="auth-body">
<input type="text" id="auth-user" class="tool-input" placeholder="basicAuth 账号" autocomplete="off">
<input type="password" id="auth-pass" class="tool-input" placeholder="basicAuth 密码" autocomplete="off">
<label class="auth-remember"><input type="checkbox" id="auth-remember"> 保存密码（仅保存在套壳设置中）</label>
</div>
<div class="auth-footer"><button id="btn-auth-cancel2" class="btn-secondary">取消</button><button id="btn-auth-login" class="btn-primary">登录</button></div>
</div>
</div>
<div id="settings-overlay" class="overlay hidden">
<div class="settings-panel">
<div class="panel-header"><span>⚙ 设置</span><button class="panel-close" id="btn-settings-close">&times;</button></div>
<div class="settings-body">

<nav class="settings-tabs" id="settings-tabs">
<button class="settings-tab active" data-tab="general">通用</button>
<button class="settings-tab" data-tab="tools">工具</button>
<button class="settings-tab" data-tab="server">服务器</button>
<button class="settings-tab" data-tab="update">更新</button>
<button class="settings-tab" data-tab="integrity">完整性</button>
</nav>
<div class="settings-content">
<div class="setting-row"><label>服务器路径</label><input type="text" id="setting-server-path" placeholder="D:\AI\SillyTavern"></div>
<div class="setting-row"><label>数据路径 (--dataRoot)</label><input type="text" id="setting-data-root" disabled></div>
<div class="setting-row"><label>窗口宽度</label><input type="number" id="setting-width" min="640" max="3840"></div>
<div class="setting-row"><label>窗口高度</label><input type="number" id="setting-height" min="480" max="2160"></div>
<div class="setting-row"><label>关闭窗口行为</label><select id="setting-close-behavior"><option value="ask">首次询问</option><option value="tray">最小化到托盘</option><option value="quit">直接退出</option></select></div>
<div class="setting-row version-row"><label>SillyTavern 版本</label><span id="version-display">检测中...</span></div>
<div class="setting-row version-row"><label>套壳版本</label><span id="shell-version-display" style="font-size:14px;color:var(--accent);font-weight:500">检测中...</span> <button id="btn-shell-changelog" class="btn-secondary" style="margin-top:4px;padding:4px 10px;font-size:11px">查看更新日志</button></div>
<div class="update-section" style="margin-top:8px">
<label style="font-size:12px;color:#9090a8;font-weight:500">🧰 工具设置</label>
<div class="setting-row"><label>备份目录</label><input type="text" id="t-backup-dir" class="tool-input" placeholder="E:\SillyTavernBackup"></div>
<div class="setting-row"><label>自动备份</label><label class="tool-switch"><input type="checkbox" id="t-backup-auto"><span class="tool-slider"></span></label><select id="t-backup-interval" class="tool-input" style="width:110px;flex:none"><option value="24">每 24 小时</option><option value="48">每 48 小时</option><option value="72">每 72 小时</option></select></div>
<div class="setting-row"><label>保留份数</label><input type="number" id="t-backup-keep" class="tool-input" min="1" max="20" value="5" style="width:70px"></div>
<div class="setting-row"><label>zip 压缩</label><select id="t-backup-zip" class="tool-input" style="width:70px"><option value="1">开</option><option value="0">关</option></select><span class="tool-note">压缩省空间</span></div>
<div id="t-backup-info" class="tool-note" style="margin:2px 0 6px"></div>



<div class="setting-row"><label>开机自启</label><select id="t-autostart" class="tool-input"><option value="0">关</option><option value="1">开</option></select></div>
<div class="setting-row"><label>窗口置顶</label><select id="t-top" class="tool-input"><option value="0">关</option><option value="1">开</option></select></div>
<div class="setting-row"><label>界面主题</label><select id="t-theme" class="tool-input"><option value="purple">深紫</option><option value="blue">深蓝</option><option value="black">纯黑</option></select></div>
<div class="setting-row"><label>UI 字体</label><select id="t-font" class="tool-input"><option value="1">100%</option><option value="1.1">110%</option><option value="0.9">90%</option></select></div>

<div class="setting-row"><label>深夜模式</label><select id="t-night" class="tool-input"><option value="0">关</option><option value="1">开</option></select><span class="tool-note">22:00-07:00 自动暖色</span></div>
<div class="setting-row"><label>PIN 锁</label><input type="password" id="t-pin" class="tool-input" placeholder="留空清除" style="width:110px"><button id="t-pin-set" class="btn-secondary" style="padding:3px 8px;font-size:11px">设置</button><span id="t-pin-status" class="tool-note"></span></div>
<div class="setting-row"><label>生成通知</label><select id="t-notify" class="tool-input"><option value="1">开</option><option value="0">关</option></select></div>
<div class="setting-row"><label>崩溃提醒</label><select id="t-crash" class="tool-input"><option value="1">开</option><option value="0">关</option></select></div>
<div class="setting-row"><label>版本回滚</label><span id="t-rollback-info" class="tool-note">-</span></div>
<div id="t-rollback-list" class="tool-detail"></div>
</div>
<div class="update-section" style="margin-top:8px">




</div>
<div class="update-section" style="margin-top:8px">
<label style="font-size:12px;color:#9090a8;font-weight:500">服务器控制</label>
<div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap">
<button id="btn-restart-server" class="btn-primary">重启服务器</button>
<button id="btn-open-st-dir" class="btn-secondary">打开 ST 目录</button>
<button id="btn-open-data-dir" class="btn-secondary">打开数据目录</button>
</div>
<div id="server-ctl-status" class="update-status"></div>
</div>
<div class="update-section" id="update-section-st">
<label style="font-size:12px;color:#9090a8;font-weight:500">SillyTavern 更新</label>
<button id="btn-check-update" class="btn-primary">检查更新</button>
<div id="update-status" class="update-status"></div>
<div id="update-progress" class="update-progress hidden"><div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div><span id="progress-text"></span></div>
</div>
<div class="update-section" id="update-section-shell" style="margin-top:8px">
<label style="font-size:12px;color:#9090a8;font-weight:500">套壳更新</label>
<div id="shell-update-status" class="update-status"></div>
<div id="shell-update-progress" class="update-progress hidden"><div class="progress-bar"><div class="progress-fill" id="shell-progress-fill"></div></div><span id="shell-progress-text"></span></div>
<div style="display:flex;gap:8px;margin-top:4px">
<button id="btn-check-shell-update" class="btn-primary">检查套壳更新</button>
</div>
</div>
<div class="update-section" style="margin-top:8px">
<label style="font-size:12px;color:#9090a8;font-weight:500">完整性检测</label>
<button id="btn-check-integrity" class="btn-primary" style="margin-top:4px">检测 SillyTavern 完整性</button>
<div id="integrity-status" class="update-status"></div>
</div>
</div>
</div>
<div class="settings-footer"><button id="btn-settings-save" class="btn-primary">保存</button><button id="btn-settings-cancel" class="btn-secondary">取消</button></div>
</div>
</div>
<script src="shell.js"></script>
</body>
</html>
