<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<title>SillyTavern</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="titlebar">
<div class="titlebar-drag-region">
<div class="titlebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
<span class="titlebar-title">SillyTavern</span>
</div>
<div class="window-controls">
<button class="win-btn win-btn-minimize" id="btn-minimize" title="最小化"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="4.5" width="8" height="1" fill="currentColor"/></svg></button>
<button class="win-btn win-btn-maximize" id="btn-maximize" title="最大化"><svg width="10" height="10" viewBox="0 0 10 10" id="icon-maximize"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg><svg width="10" height="10" viewBox="0 0 10 10" id="icon-restore" style="display:none"><rect x="2" y="0.5" width="6.5" height="6.5" fill="none" stroke="currentColor" stroke-width="1"/><rect x="0.5" y="2" width="6.5" height="6.5" fill="#1a1a2e" stroke="currentColor" stroke-width="1"/></svg></button>
<button class="win-btn win-btn-close" id="btn-close" title="最小化到托盘"><svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2"/></svg></button>
</div>
</div>
<div id="loading-overlay"><div class="loading-content">
<div class="loading-spinner"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>
<div class="loading-text">SillyTavern 启动中...</div>
<div class="loading-log" id="loading-log"></div>
</div></div>
<webview id="sillytavern-webview" allowpopups="true" class="hidden"></webview>
<div id="float-buttons">
<button id="btn-toggle-fabs" class="float-toggle" title="隐藏按钮"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4 2 7 5 4 8"/></svg></button>
<button id="btn-terminal" class="float-btn" title="终端 (Ctrl+`)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></button>
<button id="btn-settings" class="float-btn" title="设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<button id="btn-update" class="float-btn" title="检查更新"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
<button id="btn-refresh" class="float-btn" title="刷新页面 (F5)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
</div>
<div id="terminal-panel" class="panel hidden">
<div class="panel-header"><span>终端</span><div style="display:flex;gap:8px;align-items:center"><button class="panel-action" id="btn-terminal-copy" title="复制全部">📋</button><button class="panel-close" id="btn-terminal-close">&times;</button></div></div>
<div class="terminal-output" id="terminal-output"></div>
<div class="terminal-input-row"><span class="terminal-prompt">&gt;</span><input type="text" id="terminal-input" placeholder="输入命令..."></div>
</div>
<div id="settings-overlay" class="overlay hidden">
<div class="settings-panel">
<div class="panel-header"><span>⚙ 设置</span><button class="panel-close" id="btn-settings-close">&times;</button></div>
<div class="settings-body">
<div class="setting-row"><label>服务器路径</label><input type="text" id="setting-server-path" placeholder="D:\AI\SillyTavern"></div>
<div class="setting-row"><label>数据路径 (--dataRoot)</label><input type="text" id="setting-data-root" disabled></div>
<div class="setting-row"><label>窗口宽度</label><input type="number" id="setting-width" min="640" max="3840"></div>
<div class="setting-row"><label>窗口高度</label><input type="number" id="setting-height" min="480" max="2160"></div>
<div class="setting-row"><label>关闭窗口行为</label><select id="setting-close-behavior"><option value="ask">首次询问</option><option value="tray">最小化到托盘</option><option value="quit">直接退出</option></select></div>
<div class="setting-row version-row"><label>SillyTavern 版本</label><span id="version-display">检测中...</span></div>
<div class="setting-row"><label>套壳版本</label><span style="font-size:14px;color:var(--accent);font-weight:500">v1.5.4</span> <button id="btn-shell-changelog" class="btn-secondary" style="margin-top:4px;padding:4px 10px;font-size:11px">查看更新日志</button></div>
<div class="update-section">
<label style="font-size:12px;color:#9090a8;font-weight:500">SillyTavern 更新</label>
<button id="btn-check-update" class="btn-primary">检查更新</button>
<div id="update-status" class="update-status"></div>
<div id="update-progress" class="update-progress hidden"><div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div><span id="progress-text"></span></div>
</div>
<div class="update-section" style="margin-top:8px">
<label style="font-size:12px;color:#9090a8;font-weight:500">套壳更新</label>
<div id="shell-update-status" class="update-status"></div>
<div style="display:flex;gap:8px;margin-top:4px">
<button id="btn-check-shell-update" class="btn-primary">检查套壳更新</button>
</div>
</div>
<div class="update-section" style="margin-top:8px">
<label style="font-size:12px;color:#9090a8;font-weight:500">完整性检测</label>
<button id="btn-check-integrity" class="btn-primary" style="margin-top:4px">检测 SillyTavern 完整性</button>
<div id="integrity-status" class="update-status"></div>
</div>
</div>
<div class="settings-footer"><button id="btn-settings-save" class="btn-primary">保存</button><button id="btn-settings-cancel" class="btn-secondary">取消</button></div>
</div>
</div>
<script src="shell.js"></script>
</body>
</html>
